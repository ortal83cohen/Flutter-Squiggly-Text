name: Publish to pub.dev

# Publish a package version when a matching release tag is pushed. Before enabling
# this workflow, configure pub.dev publishing for this repository with the tag
# pattern v{{version}}.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Resolve dependencies before setup-dart provisions the temporary pub.dev token.
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get

      - uses: dart-lang/setup-dart@v1
      - name: Validate package
        run: flutter pub publish --dry-run
      - name: Publish to pub.dev
        run: flutter pub publish --force