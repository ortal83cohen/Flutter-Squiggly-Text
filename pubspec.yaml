name: flutter_squiggly_text
description: A Flutter widget for rendering text with a customizable squiggly underline.
version: 0.1.8
homepage: https://github.com/ortal83cohen/Flutter-Squiggly-Text
repository: https://github.com/ortal83cohen/Flutter-Squiggly-Text
issue_tracker: https://github.com/ortal83cohen/Flutter-Squiggly-Text/issues
topics:
  - flutter
  - text
  - typography
  - widget
  - animation
screenshots:
  - description: Animated squiggly underline and letter displacement in the example app.
    path: screenshots/example.gif

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  characters: ^1.4.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/squiggly_turbulence.frag
